<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .container {
            background-color: white;
            padding: 25px;
            margin: 20px auto;
            width: 70%;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }


        input {
            padding: 10px;
            width: 60%;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #eee;
            padding: 12px;
            margin: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete {
            background-color: red;
        }

        .delete:hover {
            background-color: darkred;
        }

        /* Image Gallery Styling */

        .main-image {
            width: 400px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }

        .thumbnails img {
            width: 100px;
            height: 70px;
            object-fit: cover;
            margin: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            border-radius: 5px;
        }

        .thumbnails img:hover {
            border: 3px solid blue;
        }

    </style>
</head>

<body>

    <h1>Interactive Applications using DOM Manipulation</h1>


    <div class="container">

        <h2>My To-Do List</h2>

        <input type="text" id="taskInput"
               placeholder="Enter your task">

        <button id="addBtn">Add Task</button>

        <ul id="taskList"></ul>

    </div>


    <div class="container">

        <h2>Image Gallery</h2>

        <img id="mainImage"
             class="main-image"
             src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800"
             alt="Main Image">

        <div class="thumbnails">

            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800"
                 alt="Nature">

            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800"
                 alt="Ocean">

            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
                 alt="Mountains">

            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800"
                 alt="Sunrise">

        </div>

    </div>


    <script>

        let taskInput = document.getElementById("taskInput");

        let taskList = document.getElementById("taskList");

        let addBtn = document.getElementById("addBtn");



        addBtn.addEventListener("click", function() {

            let task = taskInput.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }


            let li = document.createElement("li");

            li.textContent = task;


            let deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Remove";

            deleteBtn.className = "delete";


            deleteBtn.addEventListener("click", function() {

                li.remove();

            });

            li.appendChild(deleteBtn);

            taskList.appendChild(li);

            taskInput.value = "";

        });

        let mainImage = document.getElementById("mainImage");

        let thumbnails = document.querySelectorAll(".thumbnails img");


        thumbnails.forEach(function(image) {

            image.addEventListener("click", function() {

                mainImage.src = image.src;

            });

        });

    </script>

</body>
</html>
